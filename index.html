<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="./" />
    <title>SynthGen AI // Neon Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Inter:wght@300;400;600&family=Arial+Black&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050a10;
            --panel-bg: rgba(10, 20, 30, 0.95);
            --accent: #33ccff; 
            --accent-dim: rgba(51, 204, 255, 0.1);
            --danger: #ff3333;
            --text-main: #e2e8f0;
            --font-ui: 'Inter', system-ui, sans-serif;
            --font-header: 'Arial Black', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(51, 204, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 204, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- TYPOGRAPHY --- */
        .font-header { font-family: var(--font-header); letter-spacing: -1px; }
        .font-mono { font-family: var(--font-mono); }
        .text-accent { color: var(--accent); text-shadow: 0 0 10px rgba(51, 204, 255, 0.4); }

        /* --- COMPONENTS --- */
        .glass-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(51, 204, 255, 0.2);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Cyber Button */
        .cyber-btn {
            position: relative;
            background: rgba(51, 204, 255, 0.05);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: var(--font-header);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .cyber-btn:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 25px var(--accent);
            z-index: 10;
        }
        .cyber-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; color: #555; }
        .cyber-btn:active:not(:disabled) { transform: scale(0.99); }

        .cyber-btn-secondary {
            border-color: #475569;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.5);
        }
        .cyber-btn-secondary:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(51, 204, 255, 0.1);
            box-shadow: none;
        }

        /* Cyber Range */
        .cyber-range {
            -webkit-appearance: none; width: 100%; height: 6px; 
            background: #111; outline: none; transition: 0.2s; border-radius: 4px;
            border: 1px solid #334455;
            cursor: pointer;
        }
        .cyber-range::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 20px; height: 20px; 
            background: #15202b; border: 2px solid var(--accent); border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 10px rgba(51, 204, 255, 0.4); transition: transform 0.1s;
            margin-top: -1px; 
        }
        .cyber-range::-webkit-slider-thumb:hover { transform: scale(1.2); background: var(--accent); box-shadow: 0 0 20px var(--accent); }

        /* Splitter Handle */
        .gutter {
            width: 8px;
            cursor: col-resize;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
            z-index: 20;
        }
        .gutter:hover, .gutter-dragging {
            background: rgba(51, 204, 255, 0.1);
        }
        .gutter::after {
            content: ''; width: 2px; height: 40px; background: #334455; border-radius: 2px;
        }
        .gutter:hover::after, .gutter-dragging::after {
            background: var(--accent); box-shadow: 0 0 10px var(--accent);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020202; }
        ::-webkit-scrollbar-thumb { background: #334455; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* VISUALIZER V3.0 AESTHETICS */
        .crt-overlay {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg, 
                rgba(255, 0, 0, 0.06), 
                rgba(0, 255, 0, 0.02), 
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 10;
        }
        
        /* Mode Toggle - Compact */
        .mode-toggle {
            display: flex;
            background: #000;
            border: 1px solid var(--accent);
            padding: 2px;
            height: 32px; 
            width: 200px;
        }
        .mode-btn {
            flex: 1;
            font-family: var(--font-header);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #64748b;
            position: relative;
            overflow: hidden;
        }
        .mode-btn.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent);
            z-index: 10;
        }
        .mode-btn:hover:not(.active) {
            color: #fff;
            background: rgba(51, 204, 255, 0.1);
        }
        
        /* Waveform Icons */
        .wave-icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: 1px solid #334455;
            background: rgba(0,0,0,0.4);
            color: #64748b;
            transition: all 0.2s;
            padding: 10px;
        }
        .wave-icon-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(51, 204, 255, 0.1);
            box-shadow: 0 0 15px rgba(51, 204, 255, 0.2);
        }
        .wave-icon-btn:hover:not(.active) {
            border-color: #94a3b8;
            color: #e2e8f0;
        }
        .wave-svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Pulsing Glow Animation - Slower */
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(51, 204, 255, 0.5)); opacity: 1; }
            50% { filter: drop-shadow(0 0 15px rgba(51, 204, 255, 0.8)); opacity: 0.8; }
        }
        .icon-glow {
            animation: pulse-glow 6s infinite ease-in-out;
        }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
