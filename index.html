<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="./" />
    <title>SynthGen AI // Neon Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Inter:wght@300;400;600&family=Arial+Black&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050a10;
            --panel-bg: rgba(10, 20, 30, 0.95);
            --accent: #33ccff; 
            --accent-dim: rgba(51, 204, 255, 0.1);
            --danger: #ff3333;
            --text-main: #e2e8f0;
            --font-ui: 'Inter', system-ui, sans-serif;
            --font-header: 'Arial Black', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(51, 204, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 204, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- TYPOGRAPHY --- */
        .font-header { font-family: var(--font-header); letter-spacing: -1px; }
        .font-mono { font-family: var(--font-mono); }
        .text-accent { color: var(--accent); text-shadow: 0 0 10px rgba(51, 204, 255, 0.4); }

        /* --- COMPONENTS --- */
        .glass-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(51, 204, 255, 0.2);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Cyber Button */
        .cyber-btn {
            position: relative;
            background: rgba(51, 204, 255, 0.05);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: var(--font-header);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .cyber-btn:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 25px var(--accent);
            z-index: 10;
        }
        .cyber-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; color: #555; }
        .cyber-btn:active:not(:disabled) { transform: scale(0.99); }

        .cyber-btn-secondary {
            border-color: #475569;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.5);
        }
        .cyber-btn-secondary:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(51, 204, 255, 0.1);
            box-shadow: none;
        }

        /* Cyber Range */
        .cyber-range {
            -webkit-appearance: none; width: 100%; height: 6px; 
            background: #111; outline: none; transition: 0.2s; border-radius: 4px;
            border: 1px solid #334455;
            cursor: pointer;
        }
        .cyber-range::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 20px; height: 20px; 
            background: #15202b; border: 2px solid var(--accent); border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 10px rgba(51, 204, 255, 0.4); transition: transform 0.1s;
            margin-top: -1px; 
        }
        .cyber-range::-webkit-slider-thumb:hover { transform: scale(1.2); background: var(--accent); box-shadow: 0 0 20px var(--accent); }

        /* Splitter Handle */
        .gutter {
            width: 8px;
            cursor: col-resize;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
            z-index: 20;
        }
        .gutter:hover, .gutter-dragging {
            background: rgba(51, 204, 255, 0.1);
        }
        .gutter::after {
            content: ''; width: 2px; height: 40px; background: #334455; border-radius: 2px;
        }
        .gutter:hover::after, .gutter-dragging::after {
            background: var(--accent); box-shadow: 0 0 10px var(--accent);
        }

        /* Vertical Splitter Handle */
        .gutter-vertical {
            height: 8px;
            cursor: row-resize;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
            z-index: 20;
            width: 100%;
            border-top: 1px solid rgba(51, 204, 255, 0.1);
            border-bottom: 1px solid rgba(51, 204, 255, 0.1);
        }
        .gutter-vertical:hover, .gutter-vertical-dragging {
            background: rgba(51, 204, 255, 0.1);
        }
        .gutter-vertical::after {
            content: ''; height: 2px; width: 40px; background: #334455; border-radius: 2px;
        }
        .gutter-vertical:hover::after, .gutter-vertical-dragging::after {
            background: var(--accent); box-shadow: 0 0 10px var(--accent);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020202; }
        ::-webkit-scrollbar-thumb { background: #334455; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* VISUALIZER V3.0 AESTHETICS */
        .crt-overlay {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg, 
                rgba(255, 0, 0, 0.06), 
                rgba(0, 255, 0, 0.02), 
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 10;
        }
        
        /* Mode Toggle - Compact */
        .mode-toggle {
            display: flex;
            background: #000;
            border: 1px solid var(--accent);
            padding: 2px;
            height: 32px; 
            width: 200px;
        }
        .mode-btn {
            flex: 1;
            font-family: var(--font-header);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #64748b;
            position: relative;
            overflow: hidden;
        }
        .mode-btn.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent);
            z-index: 10;
        }
        .mode-btn:hover:not(.active) {
            color: #fff;
            background: rgba(51, 204, 255, 0.1);
        }
        
        /* Waveform Icons */
        .wave-icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: 1px solid #334455;
            background: rgba(0,0,0,0.4);
            color: #64748b;
            transition: all 0.2s;
            padding: 10px;
        }
        .wave-icon-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(51, 204, 255, 0.1);
            box-shadow: 0 0 15px rgba(51, 204, 255, 0.2);
        }
        .wave-icon-btn:hover:not(.active) {
            border-color: #94a3b8;
            color: #e2e8f0;
        }
        .wave-svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Pulsing Glow Animation - Slower */
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(51, 204, 255, 0.5)); opacity: 1; }
            50% { filter: drop-shadow(0 0 15px rgba(51, 204, 255, 0.8)); opacity: 0.8; }
        }
        .icon-glow {
            animation: pulse-glow 6s infinite ease-in-out;
        }

        /* Full Height Bounce Animation for Button */
        @keyframes bounce-vertical {
            0% { bottom: 1rem; }
            100% { bottom: calc(100% - 4.5rem); } /* Increased bounce range */
        }
        .animate-bounce-vertical {
            animation: bounce-vertical 3s ease-in-out infinite alternate; /* Slower 3s duration */
        }
        
        /* Loading Scan Animation for System Msg */
        @keyframes scan-line {
            0% { background-position: -100% 0; }
            100% { background-position: 200% 0; }
        }
        .animate-scan {
            background: linear-gradient(90deg, rgba(5,10,16,0.2) 25%, rgba(51, 204, 255, 0.15) 50%, rgba(5,10,16,0.2) 75%);
            background-size: 200% 100%;
            animation: scan-line 2s infinite linear;
        }
    </style>

        import React, { useState, useEffect, useRef } from 'react';

        import { GoogleGenAI, Type } from "@google/genai";

        // --- TYPES ---
        const AppMode = {

        };

        // --- PRESETS ---
        const FACTORY_PRESETS = [
            {

            {

                code: `const bufferSize = ctx.sampleRate * 2;
const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
const data = buffer.getChannelData(0);

for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
}

const noise = ctx.createBufferSource();
noise.buffer = buffer;

const filter = ctx.createBiquadFilter();
filter.type = 'lowpass';
filter.frequency.setValueAtTime(1000, ctx.currentTime);
filter.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 1.5);

const gain = ctx.createGain();
gain.gain.setValueAtTime(1, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);

noise.connect(filter);
filter.connect(gain);
gain.connect(destination);

noise.start();
noise.stop(ctx.currentTime + 2);`
            },
            {
                title: "UI Click",
                description: "Clean, high-pitched interface selection click.",
                code: `const osc = ctx.createOscillator();
const gain = ctx.createGain();

osc.type = 'sine';
osc.frequency.setValueAtTime(1200, ctx.currentTime);
osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.05);

gain.gain.setValueAtTime(0.3, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);

osc.connect(gain);
gain.connect(destination);

osc.start();
osc.stop(ctx.currentTime + 0.06);`
            },
            {
                title: "Ambient Pad",
                description: "Soft, detuned sawtooth pad with slow attack and long release.",
                code: `const osc1 = ctx.createOscillator();
const osc2 = ctx.createOscillator();
const gain = ctx.createGain();

osc1.type = 'sawtooth';
osc1.frequency.value = 220; // A3

osc2.type = 'sawtooth';
osc2.frequency.value = 221.5; // Slight detune

gain.gain.setValueAtTime(0, ctx.currentTime);
gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 1.0); // Attack

            },
            {
                title: "Bass Drop",
                description: "Heavy sub-bass sine wave sweeping from 150Hz to 30Hz.",
                code: `const osc = ctx.createOscillator();
const gain = ctx.createGain();

osc.type = 'sine';
osc.frequency.setValueAtTime(150, ctx.currentTime);
osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 1.5);

gain.gain.setValueAtTime(0.8, ctx.currentTime);
gain.gain.linearRampToValueAtTime(0.8, ctx.currentTime + 1.0);
gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.5);

osc.connect(gain);
gain.connect(destination);

osc.start();
osc.stop(ctx.currentTime + 1.6);`
            },
            {
                title: "Synth Lead",
                description: "Square wave lead with LFO-driven vibrato.",
                code: `const osc = ctx.createOscillator();
const lfo = ctx.createOscillator();
const lfoGain = ctx.createGain();
const gain = ctx.createGain();

osc.type = 'square';
osc.frequency.value = 440;

lfo.type = 'sine';
lfo.frequency.value = 5; // 5Hz vibrato rate
lfoGain.gain.value = 10; // Vibrato depth

lfo.connect(lfoGain);
lfoGain.connect(osc.frequency);

gain.gain.setValueAtTime(0, ctx.currentTime);
gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
gain.gain.setValueAtTime(0.3, ctx.currentTime + 1.5);
gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 2.0);

osc.connect(gain);
gain.connect(destination);

osc.start();
lfo.start();
osc.stop(ctx.currentTime + 2.1);

            },
            {
                title: "Drone",
                description: "Dark, slowly modulating cinematic drone tone.",
                code: `const carrier = ctx.createOscillator();
const modulator = ctx.createOscillator();
const modGain = ctx.createGain();
const masterGain = ctx.createGain();

carrier.type = 'triangle';
carrier.frequency.value = 55; // Low A

modulator.type = 'sine';
modulator.frequency.value = 0.5; // Slow modulation
modGain.gain.value = 20;

modulator.connect(modGain);
modGain.connect(carrier.frequency);

masterGain.gain.setValueAtTime(0, ctx.currentTime);
masterGain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 2.0);
masterGain.gain.setValueAtTime(0.4, ctx.currentTime + 4.0);
masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 6.0);

carrier.connect(masterGain);
masterGain.connect(destination);

carrier.start();
modulator.start();
carrier.stop(ctx.currentTime + 6.1);
modulator.stop(ctx.currentTime + 6.1);`
            },
            {
                title: "Bell",
                description: "Metallic bell sound created with FM synthesis (2:1 ratio).",
                code: `const carrier = ctx.createOscillator();
const modulator = ctx.createOscillator();
const modGain = ctx.createGain();
const env = ctx.createGain();

carrier.type = 'sine';
carrier.frequency.value = 800;

modulator.type = 'sine';
modulator.frequency.value = 1600; // 2:1 ratio
modGain.gain.setValueAtTime(1000, ctx.currentTime);
modGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);

modulator.connect(modGain);
modGain.connect(carrier.frequency);

env.gain.setValueAtTime(0, ctx.currentTime);
env.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.01);
env.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2.0);

carrier.connect(env);
env.connect(destination);

carrier.start();
modulator.start();
carrier.stop(ctx.currentTime + 2.1);
modulator.stop(ctx.currentTime + 2.1);`
            },
            {
                title: "Sci-Fi Alarm",
                description: "Urgent two-tone square wave alarm alternating pitch.",
                code: `const osc = ctx.createOscillator();
const gain = ctx.createGain();

osc.type = 'square';
osc.frequency.setValueAtTime(880, ctx.currentTime);
osc.frequency.setValueAtTime(1200, ctx.currentTime + 0.2);
osc.frequency.setValueAtTime(880, ctx.currentTime + 0.4);
osc.frequency.setValueAtTime(1200, ctx.currentTime + 0.6);
osc.frequency.setValueAtTime(880, ctx.currentTime + 0.8);

gain.gain.value = 0.2;

osc.connect(gain);
gain.connect(destination);

osc.start();
osc.stop(ctx.currentTime + 1.0);`
            }
        ];

        // --- SERVICES: AUDIO UTILS ---
        let audioCtx = null;
        let masterGain = null;
        let analyser = null;

        const getAudioContext = () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        };

        const getMasterGain = () => {
            const ctx = getAudioContext();
            if (!masterGain) {
                masterGain = ctx.createGain();
                masterGain.gain.value = 0.5; // Default master volume
                masterGain.connect(ctx.destination);
            }
            return masterGain;
        };

        const setMasterVolume = (val) => {
            const ctx = getAudioContext();
            const master = getMasterGain();
            // Smooth transition to avoid clicks
            master.gain.setTargetAtTime(val, ctx.currentTime, 0.1);
        };

        const getAnalyser = () => {
            const ctx = getAudioContext();
            const master = getMasterGain();
            if (!analyser) {
                analyser = ctx.createAnalyser();
                analyser.fftSize = 2048;
                master.disconnect(); // Disconnect from destination to insert analyser
                master.connect(analyser);
                analyser.connect(ctx.destination);
            }
            return analyser;
        };

        const playManualSynth = (params) => {
            const ctx = getAudioContext();
            const master = getMasterGain(); 

            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            const filter = ctx.createBiquadFilter();

            osc.type = params.waveType;
            osc.frequency.value = params.frequency;

            filter.type = params.filterType;
            filter.frequency.value = params.filterFreq;

            // Envelope
            const now = ctx.currentTime;
            const { attack, decay, sustain, release } = params;

            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(params.gain, now + attack);
            gainNode.gain.exponentialRampToValueAtTime(params.gain * sustain, now + attack + decay);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + attack + decay + release); 

            osc.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(master); 

            osc.start(now);
            osc.stop(now + attack + decay + release + 0.1);
        };

        const executeGeneratedCode = (code) => {
            try {
                const ctx = getAudioContext();
                const master = getMasterGain();

                const runnable = new Function('ctx', 'destination', `
                ${code}
                // Attempt to call playEffect if the user defined it, otherwise assume code ran immediately
                if (typeof playEffect === 'function') {
                    playEffect(ctx, destination);
                }
                `);

                runnable(ctx, master);
            } catch (e) {
                console.error("Error executing generated audio code:", e);
                alert("Error executing code: " + e);
            }
        };

        const fileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const result = reader.result;
                    // Remove data URL prefix
                    const base64 = result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = error => reject(error);
            });
        };

        // --- SERVICES: GEMINI SERVICE ---
        const MODEL_ID = "gemini-3-flash-preview";

        // Helper to get fresh AI instance
        const getAI = () => {
            const key = window.process.env.API_KEY || localStorage.getItem('gemini_api_key');
            if (!key || key.length < 10) {
                throw new Error("API Key missing or invalid. Click the Key icon in the top right to configure.");
            }
            return new GoogleGenAI({ apiKey: key });
        };

        const generateSynthCodeFromAudio = async (base64Audio, mimeType) => {
            const systemInstruction = `
                You are an expert Audio DSP Engineer.
                Return ONLY valid JSON. Structure:
                {
                    "code": "function body string (no signature)",
                    "explanation": "concise technical summary",
                    "soundDescription": "short creative name"
                }
                The code is the BODY of: function playEffect(ctx, destination) { ... }
                Use 'ctx' (AudioContext), connect to 'destination'. Clean up nodes using stop() or garbage collection.
                
                Process:
                1. Analyze the audio's waveform, spectrogram, and frequency content.
                2. Reconstruct the sound using Web Audio API nodes (Oscillators, Gains, Filters, Noise).
                3. Ensure the code runs immediately and produces sound.
            `;

            try {
                const ai = getAI();
                const response = await ai.models.generateContent({
                model: MODEL_ID,
                contents: {
                    parts: [
                    {
                        inlineData: {
                        mimeType: mimeType,
                        data: base64Audio,
                        },
                    },
                    {
                        text: "Analyze this audio file's characteristics (timbre, envelope, frequency content). Write a Web Audio API function body to synthesize a similar sound procedurally."
                    }
                    ]
                },
                config: {
                    systemInstruction: systemInstruction,
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: Type.OBJECT,
                        properties: {
                            code: { type: Type.STRING },
                            explanation: { type: Type.STRING },
                            soundDescription: { type: Type.STRING }
                        },
                        required: ["code", "explanation", "soundDescription"]
                    }
                }
                });

                const text = response.text;
                if (!text) throw new Error("No response from AI");
                
                return JSON.parse(text);

            } catch (error) {
                console.error("Gemini API Error:", error);
                throw error;
            }
        };

        const generateSynthCodeFromText = async (description, currentParams) => {
            const systemInstruction = `
                You are an expert Web Audio API Developer.
                Return ONLY valid JSON. Structure:
                {
                    "code": "function body string (no signature)",
                    "explanation": "concise technical summary",
                    "soundDescription": "short creative name"
                }
                The code is the BODY of: function playEffect(ctx, destination) { ... }
                Use 'ctx' (AudioContext), connect to 'destination'. Clean up nodes using stop() or garbage collection.
            `;

            try {
                const ai = getAI();
                const response = await ai.models.generateContent({
                model: MODEL_ID,
                contents: `Generate Web Audio API code to create this sound: "${description}". 
                Consider manual synth settings if relevant: ${currentParams ? JSON.stringify(currentParams) : 'none'}`,
                config: {
                    systemInstruction: systemInstruction,
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: Type.OBJECT,
                        properties: {
                            code: { type: Type.STRING },
                            explanation: { type: Type.STRING },
                            soundDescription: { type: Type.STRING }
                        },
                        required: ["code", "explanation", "soundDescription"]
                    }
                }
                });
                
                const text = response.text;
                if (!text) throw new Error("No response from AI");
                return JSON.parse(text);
            } catch (error) {
                console.error("Text Gen Error:", error);
                throw error;
            }
        };

        const refineCodeWithPrompt = async (currentCode, userInstruction) => {
            const prompt = `
                Here is an existing Web Audio API code snippet (body only):
                \`\`\`javascript
                ${currentCode}
                \`\`\`
                
                The user wants to modify it: "${userInstruction}".
                
                Return the updated JSON with 'code' and 'explanation'. Ensure the code is still the BODY of the function.
            `;

            try {
                const ai = getAI();
                const response = await ai.models.generateContent({
                model: MODEL_ID,
                contents: prompt,
                config: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: Type.OBJECT,
                        properties: {
                            code: { type: Type.STRING },
                            explanation: { type: Type.STRING }
                        }
                    }
                }
                });
                
                const text = response.text;
                if (!text) throw new Error("No response from AI");
                return JSON.parse(text);
            } catch (error) {
                console.error("Refine Error:", error);
                throw error;
            }
        };

        // --- COMPONENTS ---
        const Visualizer = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const analyser = getAnalyser();
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                let animationId;

                const render = () => {
                    animationId = requestAnimationFrame(render);

                    // Handle resize explicitly for sharp rendering
                    if (canvas.parentElement && canvas.width !== canvas.parentElement.offsetWidth) {
                        canvas.width = canvas.parentElement.offsetWidth;
                        canvas.height = canvas.parentElement.offsetHeight;
                    }
                    const w = canvas.width;
                    const h = canvas.height;
                    
                    analyser.getByteTimeDomainData(dataArray);

                    // Clear
                    ctx.clearRect(0, 0, w, h);

                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#33ccff'; // Neon Accent
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#33ccff';
                    ctx.beginPath();

                    const sliceWidth = w * 1.0 / bufferLength;
                    let x = 0;

                    for (let i = 0; i < bufferLength; i++) {
                        const v = dataArray[i] / 128.0;
                        const y = v * h / 2;

                        if (i === 0) {
                        ctx.moveTo(x, y);
                        } else {
                        ctx.lineTo(x, y);
                        }

                        x += sliceWidth;
                    }

                    ctx.lineTo(w, h / 2);
                    ctx.stroke();
                };

                render();

                return () => {
                    cancelAnimationFrame(animationId);
                };
            }, []);

            return (
                <div className="w-full h-full bg-black border border-gray-800 relative overflow-hidden">
                    <div className="crt-overlay"></div>
                    <div className="absolute top-2 left-3 text-xs text-[#33ccff] font-bold tracking-widest pointer-events-none uppercase z-20 opacity-80">

                </div>
            );

        const SoundWaveIcon = () => (

                <path d="M16 8v8" />

                <path d="M4 10v4" />

        const WaveIcons = {

            sawtooth: <path d="M4 18L12 6v12l8-12" />,
            triangle: <path d="M3 18l9-12 9 12" />

        const DEFAULT_CODE = `// Welcome to SynthGen AI
const osc = ctx.createOscillator();
const gain = ctx.createGain();

osc.type = 'triangle'; 
osc.frequency.setValueAtTime(261.63, ctx.currentTime); 
osc.frequency.linearRampToValueAtTime(329.63, ctx.currentTime + 1.0); 

gain.gain.setValueAtTime(0, ctx.currentTime);
gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.2); 
gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 2.0); 

osc.connect(gain);
gain.connect(destination);

osc.start();
osc.stop(ctx.currentTime + 2.1);`;

        // --- APP COMPONENT ---
        const App = () => {

            const [synthParams, setSynthParams] = useState({

            useEffect(() => {

                    setLibrary(defaults);

                    setTempKey(savedKey);

            }, []);

            useEffect(() => {
                localStorage.setItem('synthgen_library', JSON.stringify(library));

            // Horizontal Drag
            const handleMouseDown = (e) => { setIsDragging(true); e.preventDefault(); };
            useEffect(() => {

                    const rect = workspaceRef.current.getBoundingClientRect();
                    const newWidth = ((e.clientX - rect.left) / rect.width) * 100;
                    if (newWidth > 20 && newWidth < 80) setLeftPanelWidth(newWidth);

                const handleMouseUp = () => setIsDragging(false);

                    document.addEventListener('mousemove', handleMouseMove);
                    document.addEventListener('mouseup', handleMouseUp);
                    document.body.style.cursor = 'col-resize';
                } else {
                    document.body.style.cursor = 'default';
                }
                return () => { document.removeEventListener('mousemove', handleMouseMove); document.removeEventListener('mouseup', handleMouseUp); };
            }, [isDragging]);

            // Vertical Drag
            const handleVerticalMouseDown = (e) => {

                e.preventDefault();

            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (!isDraggingVertical || !rightPanelRef.current) return;
                    const rect = rightPanelRef.current.getBoundingClientRect();

                    const relativeY = e.clientY - rect.top;

                        setTopPanelHeight(newHeight);

                const handleMouseUp = () => {
                    setIsDraggingVertical(false);
                    document.body.style.cursor = 'default';

                    document.addEventListener('mousemove', handleMouseMove);
                    document.addEventListener('mouseup', handleMouseUp);

                return () => {
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);

            }, [isDraggingVertical]);

            const addToLibrary = (code, desc, title = "Generated Sound") => {
                const newItem = {
                    id: crypto.randomUUID(),
                    title: title,
                    code: code,
                    description: desc,
                    notes: "",
                    timestamp: Date.now()

                setLibrary(prev => [newItem, ...prev]);
                return newItem;
            };

            const startDelete = (id) => {
                setPendingDeletes(prev => ({ ...prev, [id]: 3 }));
            };

            const cancelDelete = (id) => {
                setPendingDeletes(prev => {
                    const next = { ...prev };
                    delete next[id];
                    return next;
                });
            };

            useEffect(() => {
                const interval = setInterval(() => {
                    setPendingDeletes(prev => {
                        const next = { ...prev };
                        let changed = false;
                        for (const id in next) {
                            if (next[id] > 0) {
                                next[id] -= 1;
                                changed = true;
                            }
                        }
                        return changed ? next : prev;
                    });
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                Object.entries(pendingDeletes).forEach(([id, count]) => {
                    if (count <= 0) {
                        setLibrary(prev => prev.filter(item => item.id !== id));
                        setPendingDeletes(prev => {
                            const next = { ...prev };
                            delete next[id];
                            return next;
                        });
                    }
                });
            }, [pendingDeletes]);

            const updateItem = (id, updates) => {
                setLibrary(prev => prev.map(item => item.id === id ? { ...item, ...updates } : item));
            };

            const toggleExpand = (id) => {
                setExpandedItems(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const playLibraryItem = (item) => {

                    setPlayingId(null);
                    getAudioContext().suspend(); 
                    setTimeout(() => getAudioContext().resume(), 50);

                    setPlayingId(item.id);
                    setTimeout(() => setPlayingId(null), 2000);

            };

            const loadIntoEditor = (item) => {

                setExplanation(`Loaded module: ${item.title}`);
            };

            const updateVolume = (val) => {
                setMasterVolState(val);
                setMasterVolume(val);
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                if (file.size > 4 * 1024 * 1024) { setExplanation("ERROR: File too large (Max 4MB)."); return; }
                
                setIsLoading(true);
                setExplanation("Uploading & Analyzing Audio...");
                try {
                    const base64 = await fileToBase64(file);
                    const result = await generateSynthCodeFromAudio(base64, file.type);
                    setGeneratedCode(result.code);
                    setExplanation("Analysis complete. Code generated from source audio.");
                    addToLibrary(result.code, result.explanation, file.name || "Imported Audio");
                } catch (error) {
                    setExplanation("Analysis Failed: " + error.message);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleTextGen = async () => {

                setIsLoading(true);
                setExplanation("Generating synthesis parameters...");
                try {
                    const result = await generateSynthCodeFromText(userPrompt, synthParams);
                    setGeneratedCode(result.code);
                    setExplanation("Generation complete. Module ready.");
                    addToLibrary(result.code, result.explanation, userPrompt);
                } catch (error) {
                    setExplanation("Generation Failed: " + error.message);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleRefine = async () => {
                if (!refinePrompt.trim()) return;
                setIsLoading(true);
                setExplanation("Refining module logic...");
                try {
                    const result = await refineCodeWithPrompt(generatedCode, refinePrompt);
                    setGeneratedCode(result.code);
                    setExplanation("Refinement applied.");
                    
                    const timestamp = new Date().toLocaleTimeString();
                    const refineTitle = `Refined: ${refinePrompt.slice(0, 15)}... (${timestamp})`;
                    
                    addToLibrary(result.code, result.explanation, refineTitle);
                    
                    setRefinePrompt("");
                } catch (error) {
                    setExplanation("Refinement Failed: " + error.message);
                } finally {
                    setIsLoading(false);
                }
            };

            const runCode = () => {
                getAudioContext().resume();
                executeGeneratedCode(generatedCode);
            };

            const triggerManual = () => {
                getAudioContext().resume();
                playManualSynth(synthParams);
            };

            const updateParam = (key, val) => {
                setSynthParams(prev => ({...prev, [key]: val}));
            };

            const saveApiKey = () => {
                if (!tempKey.trim()) return;
                localStorage.setItem('gemini_api_key', tempKey.trim());
                window.process.env.API_KEY = tempKey.trim();
                setShowKeyModal(false);
                setExplanation("SYSTEM: Authorization credentials updated. Uplink established.");
            };

            return (
                <div className="flex flex-col h-screen p-6 box-border select-none font-ui font-light">
                    {/* HEADER */}
                    <header className="flex justify-between items-center mb-6 pb-2 border-b border-gray-800 flex-shrink-0 z-10">
                        <div className="flex flex-col w-1/4">
                            <h1 className="text-2xl text-white font-light tracking-tight flex items-center gap-3">
                                <SoundWaveIcon />
                                <span className="font-semibold tracking-tighter">SYNTHGEN</span> AI
                            </h1>
                        </div>

                        <div className="flex-grow flex justify-center">
                            <div className="flex bg-black/40 border border-[#33ccff]/30 p-1 rounded-sm gap-1">
                                <button 
                                    onClick={() => setMode(AppMode.AI_CLONE)} 
                                    className={`px-6 py-2 text-xs font-bold uppercase tracking-wider transition-all duration-300 rounded-sm ${
                                        mode === AppMode.AI_CLONE 
                                        ? 'bg-[#33ccff] text-black shadow-[0_0_15px_rgba(51,204,255,0.4)]' 
                                        : 'text-slate-500 hover:text-[#33ccff] hover:bg-[#33ccff]/5'
                                    }`}
                                >
                                    Audio Library
                                </button>
                                <button 
                                    onClick={() => setMode(AppMode.MANUAL)} 
                                    className={`px-6 py-2 text-xs font-bold uppercase tracking-wider transition-all duration-300 rounded-sm ${
                                        mode === AppMode.MANUAL 
                                        ? 'bg-[#33ccff] text-black shadow-[0_0_15px_rgba(51,204,255,0.4)]' 
                                        : 'text-slate-500 hover:text-[#33ccff] hover:bg-[#33ccff]/5'
                                    }`}
                                >
                                    Manual Synth
                                </button>
                            </div>
                        </div>

                        <div className="w-1/4 flex justify-end items-center gap-4">
                            <button

                                title="Configure API Key"
                            >
                                <Key size={16} />
                            </button>
                            <div className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">
                                v2.0.9 // <span className="text-[#33ccff]">ONLINE</span>
                            </div>
                        </div>
                    </header>

                                <div className="flex justify-between items-center">

                                    RESET

                                            {library.length === 0 && !isLoading && (

                                                            <div

                                                                onClick={() => loadIntoEditor(item)}

                                                                <div className="flex items-baseline gap-2 mb-0.5">

                                                            <button

                                                                className="w-full flex items-center justify-between px-2 py-1 text-[9px] text-slate-600 hover:text-slate-400 uppercase tracking-wider border border-transparent hover:border-[#33ccff]/20 transition-colors"

                                                            {isExpanded && (
                                                                <div className="mt-2 relative animate-in slide-in-from-top-2 duration-200">
                                                                    <textarea 
                                                                        value={item.description}
                                                                        onChange={(e) => updateItem(item.id, { description: e.target.value })}
                                                                        className="w-full h-24 bg-black/50 border border-slate-700 text-[10px] text-slate-300 font-mono p-2 focus:border-[#33ccff] focus:outline-none resize-none leading-relaxed"
                                                                        spellCheck={false}
                                                                    />
                                                                    <button 
                                                                        onClick={() => navigator.clipboard.writeText(item.description)}
                                                                        className="absolute bottom-2 right-2 px-2 py-0.5 bg-slate-900 text-[#33ccff] border border-[#33ccff] hover:bg-[#33ccff] hover:text-black text-[9px] font-bold uppercase transition-all z-10 shadow-lg"
                                                                    >
                                                                        COPY
                                                                    </button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex flex-col gap-8 p-6">
                                        <div className="space-y-3">
                                            <div className="text-xs font-bold text-[#33ccff] tracking-wider">AI PROMPT GENERATOR</div>
                                            <div className="flex gap-3 h-10">
                                                <input 
                                                    type="text" 
                                                    className="w-full bg-black/50 border border-slate-700 px-4 text-sm font-mono text-white focus:border-[#33ccff] outline-none placeholder-slate-600"
                                                    placeholder="e.g. 'Retro laser jump'"
                                                    value={userPrompt}
                                                    onKeyDown={(e) => e.key === 'Enter' && handleTextGen()}
                                                    onChange={e => setUserPrompt(e.target.value)}
                                                />
                                                <button onClick={handleTextGen} disabled={isLoading} className="cyber-btn px-6 text-sm font-bold">GEN</button>
                                            </div>
                                        </div>
                                        
                                        <div className="h-px bg-slate-800"></div>

                                        <div className="space-y-6">
                                            <div className="text-xs font-bold text-slate-500 tracking-wider">MANUAL OVERRIDE</div>
                                            
                                            <div className="grid grid-cols-4 gap-2">
                                                {['sine','square','sawtooth','triangle'].map(t => (
                                                    <button key={t} 
                                                        onClick={() => updateParam('waveType', t)}
                                                        className={`wave-icon-btn ${synthParams.waveType === t ? 'active' : ''}`}
                                                    >
                                                        <svg className="wave-svg" viewBox="0 0 24 24">{WaveIcons[t]}</svg>
                                                        <span className="text-[10px] uppercase font-bold">{t === 'sawtooth' ? 'saw' : t}</span>
                                                    </button>
                                                ))}
                                            </div>

                                            <div className="space-y-5">
                                                <div>
                                                    <div className="flex justify-between text-[10px] text-[#33ccff] font-bold tracking-wider mb-2"><span>FREQUENCY</span><span>{synthParams.frequency} Hz</span></div>
                                                    <input type="range" className="cyber-range" min="50" max="2000" value={synthParams.frequency} onChange={e => updateParam('frequency', Number(e.target.value))} />
                                                </div>
                                                <div>
                                                    <div className="flex justify-between text-[10px] text-[#33ccff] font-bold tracking-wider mb-2"><span>FILTER CUTOFF</span><span>{synthParams.filterFreq} Hz</span></div>
                                                    <input type="range" className="cyber-range" min="100" max="5000" value={synthParams.filterFreq} onChange={e => updateParam('filterFreq', Number(e.target.value))} />
                                                </div>
                                            </div>
                                            
                                            <div className="grid grid-cols-4 gap-4 pt-2">
                                                {['attack', 'decay', 'sustain', 'release'].map((k) => (
                                                    <div key={k} className="flex flex-col gap-2">
                                                        <span className="text-[10px] text-center text-slate-400 font-bold uppercase">{k.charAt(0)}</span>
                                                        <input 
                                                            type="range" 
                                                            className="cyber-range" 
                                                            min="0" 
                                                            max={k === 'release' ? 2 : 1} 
                                                            step="0.05" 
                                                            value={synthParams[k]} 
                                                            onChange={e => updateParam(k, Number(e.target.value))} 
                                                        />
                                                    </div>
                                                ))}
                                            </div>

                                            <button onClick={triggerManual} className="cyber-btn cyber-btn-secondary w-full py-3 gap-3 mt-4 text-sm font-bold">
                                                <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                                                TRIGGER SOUND
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* SPLITTER */}
                        <div ref={splitterRef} className={`gutter ${isDragging ? 'gutter-dragging' : ''}`} onMouseDown={handleMouseDown}></div>

                        {/* RIGHT PANEL */}
                        <div className="glass-panel" style={{ flexBasis: `${100 - leftPanelWidth}%` }}>
                            <div className="flex h-12 border-b border-white/10 bg-black/40 relative z-20 items-stretch justify-between flex-shrink-0">
                                <div className="flex items-center px-6">
                                    <h2 className="text-white font-semibold text-xs uppercase tracking-wide">Generated Module</h2>
                                </div>
                                <div className="flex">
                                    <button 
                                        onClick={() => navigator.clipboard.writeText(generatedCode)} 
                                        className="flex items-center gap-1 px-4 text-[10px] text-slate-400 hover:text-white transition-colors border-l border-white/5"
                                    >
                                        <Copy size={12}/> COPY
                                    </button>
                                    <button 
                                        onClick={runCode} 
                                        className="flex items-center px-8 bg-[#33ccff]/10 text-[#33ccff] hover:bg-[#33ccff] hover:text-black hover:shadow-[0_0_20px_rgba(51,204,255,0.5)] border-l border-white/10 font-bold tracking-widest text-xs transition-all uppercase gap-2"
                                    >
                                        <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                        SIMULATE
                                    </button>
                                </div>
                            </div>
                            
                            <div ref={rightPanelRef} className="flex flex-col flex-grow overflow-hidden relative">
                                <div style={{ height: `${topPanelHeight}%` }} className="relative bg-[#080c10] overflow-hidden z-0">
                                    <textarea 
                                        value={generatedCode}
                                        onChange={e => setGeneratedCode(e.target.value)}
                                        className="w-full h-full bg-transparent text-cyan-50 font-mono text-xs p-6 border-none focus:outline-none resize-none leading-relaxed"
                                        spellCheck={false}
                                    ></textarea>
                                </div>

                                <div 
                                    className={`gutter-vertical ${isDraggingVertical ? 'gutter-vertical-dragging' : ''}`} 
                                    onMouseDown={handleVerticalMouseDown}
                                ></div>

                                <div className="flex-grow border-t border-white/10 bg-black/40 flex flex-col overflow-hidden min-h-0">
                                    <div className="flex-grow flex flex-col px-4 pt-3 pb-6 overflow-hidden gap-3">
                                        
                                        {/* System Message Log */}
                                        <div className={`text-[10px] font-mono p-3 rounded leading-relaxed flex-shrink-0 min-h-[40px] max-h-32 overflow-y-auto custom-scrollbar shadow-inner transition-all duration-500 relative overflow-hidden ${
                                            isLoading 
                                            ? 'bg-[#33ccff]/10 border border-[#33ccff]/40 text-[#33ccff] shadow-[0_0_20px_rgba(51,204,255,0.2)] animate-scan' 
                                            : 'bg-black/20 border border-slate-800 text-slate-400'
                                        }`}>
                                            <div className="relative z-10">
                                                <span className="text-[#33ccff] font-bold">SYSTEM_MSG:</span> {explanation}
                                            </div>
                                        </div>

                                        {/* AI Prompt Generator - Expands to fill space */}
                                        <div className="flex-grow flex flex-col min-h-0 space-y-2">
                                            <div className="text-xs font-bold text-[#33ccff] tracking-wider flex-shrink-0 flex justify-between items-center">
                                                <span>AI PROMPT GENERATOR</span>
                                                <span className="text-[9px] text-slate-600 font-mono">SHIFT+ENTER FOR NEW LINE</span>
                                            </div>
                                            <div className="flex-grow relative group">
                                                <textarea 
                                                    className="w-full h-full bg-black/50 border border-slate-700 rounded p-4 text-sm font-mono text-white focus:border-[#33ccff] outline-none resize-none placeholder-slate-600 leading-relaxed custom-scrollbar transition-colors"
                                                    placeholder="Describe your sound effect..."
                                                    value={userPrompt}
                                                    onKeyDown={(e) => {
                                                        if (e.key === 'Enter' && !e.shiftKey) {
                                                            e.preventDefault();
                                                            handleTextGen();
                                                        }
                                                    }}
                                                    onChange={e => setUserPrompt(e.target.value)}
                                                />
                                                <button 
                                                    onClick={handleTextGen} 
                                                    disabled={isLoading} 
                                                    style={{ animationPlayState: isLoading ? 'paused' : 'running' }}
                                                    className="absolute right-4 bottom-4 w-14 h-14 rounded-full border border-[#33ccff]/30 bg-[#33ccff]/10 backdrop-blur-[2px] text-[#33ccff] font-bold text-[10px] tracking-widest shadow-[0_0_15px_rgba(51,204,255,0.1)] hover:bg-[#33ccff]/20 hover:shadow-[0_0_30px_#33ccff] hover:border-[#33ccff] transition-all duration-300 z-20 animate-bounce-vertical flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
                                                >
                                                    {isLoading ? '...' : 'GEN'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Refine Bar - Moved Outside */}
                            <div className="h-12 border-t border-white/5 bg-black/20 flex items-center pr-2 flex-shrink-0 z-20">
                                <input 
                                    type="text" 
                                    className="flex-grow bg-transparent px-4 text-xs font-mono text-white focus:outline-none placeholder-slate-600 h-full"
                                    placeholder="Type to refine code..." 
                                    value={refinePrompt}
                                    onChange={e => setRefinePrompt(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleRefine()}
                                />
                                <button onClick={handleRefine} className="h-8 w-8 flex items-center justify-center text-slate-500 hover:text-white hover:bg-white/5 rounded transition-colors">
                                    <ChevronRight size={16} />
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* API KEY MODAL */}
                    {showKeyModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-md">
                            <div className="w-96 glass-panel p-6 relative border border-[#33ccff]/30 shadow-[0_0_50px_rgba(51,204,255,0.1)]">
                                <button onClick={() => setShowKeyModal(false)} className="absolute top-2 right-2 text-slate-500 hover:text-white"><X size={16}/></button>
                                <h3 className="text-[#33ccff] font-bold text-sm tracking-widest mb-4 flex items-center gap-2">
                                    <Key size={14}/> SYSTEM AUTHORIZATION
                                </h3>
                                <p className="text-[10px] text-slate-400 mb-4 leading-relaxed">
                                    Initialize connection with Google Gemini API. <br/>
                                    <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-white hover:text-[#33ccff] underline decoration-dotted">Get your API Key here</a>.
                                </p>
                                <input 
                                    type="password" 
                                    value={tempKey}
                                    onChange={e => setTempKey(e.target.value)}
                                    placeholder="Paste API Key..."
                                    className="w-full bg-black/50 border border-slate-700 text-xs text-white p-3 focus:border-[#33ccff] outline-none font-mono mb-4"
                                />
                                <button onClick={saveApiKey} className="cyber-btn w-full py-2 text-xs font-bold">ESTABLISH UPLINK</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
  </body>
</html>
