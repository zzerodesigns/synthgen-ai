    <style>
        :root {
            --bg-dark: #050a10;
            --panel-bg: rgba(10, 20, 30, 0.95);
            --accent: #33ccff; 
            --accent-dim: rgba(51, 204, 255, 0.1);
            --danger: #ff3333;
            --text-main: #e2e8f0;
            --font-ui: 'Inter', system-ui, sans-serif;
            --font-header: 'Arial Black', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(51, 204, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 204, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- TYPOGRAPHY --- */
        .font-header { font-family: var(--font-header); letter-spacing: -1px; }
        .font-mono { font-family: var(--font-mono); }
        .text-accent { color: var(--accent); text-shadow: 0 0 10px rgba(51, 204, 255, 0.4); }

        /* --- COMPONENTS --- */
        .glass-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(51, 204, 255, 0.2);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Cyber Button */
        .cyber-btn {
            position: relative;
            background: rgba(51, 204, 255, 0.05);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: var(--font-header);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .cyber-btn:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 25px var(--accent);
            z-index: 10;
        }
        .cyber-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; color: #555; }
        .cyber-btn:active:not(:disabled) { transform: scale(0.99); }

        .cyber-btn-secondary {
            border-color: #475569;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.5);
        }
        .cyber-btn-secondary:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(51, 204, 255, 0.1);
            box-shadow: none;
        }

        /* Cyber Range */
        .cyber-range {
            -webkit-appearance: none; width: 100%; height: 6px; 
            background: #111; outline: none; transition: 0.2s; border-radius: 4px;
            border: 1px solid #334455;
            cursor: pointer;
        }
        .cyber-range::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 20px; height: 20px; 
            background: #15202b; border: 2px solid var(--accent); border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 10px rgba(51, 204, 255, 0.4); transition: transform 0.1s;
            margin-top: -1px; 
        }
        .cyber-range::-webkit-slider-thumb:hover { transform: scale(1.2); background: var(--accent); box-shadow: 0 0 20px var(--accent); }

        /* Splitter Handle */
        .gutter {
            width: 8px;
            cursor: col-resize;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
            z-index: 20;
        }
        .gutter:hover, .gutter-dragging {
            background: rgba(51, 204, 255, 0.1);
        }
        .gutter::after {
            content: ''; width: 2px; height: 40px; background: #334455; border-radius: 2px;
        }
        .gutter:hover::after, .gutter-dragging::after {
            background: var(--accent); box-shadow: 0 0 10px var(--accent);
        }

        /* Vertical Splitter Handle */
        .gutter-vertical {
            height: 8px;
            cursor: row-resize;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
            z-index: 20;
            width: 100%;
            border-top: 1px solid rgba(51, 204, 255, 0.1);
            border-bottom: 1px solid rgba(51, 204, 255, 0.1);
        }
        .gutter-vertical:hover, .gutter-vertical-dragging {
            background: rgba(51, 204, 255, 0.1);
        }
        .gutter-vertical::after {
            content: ''; height: 2px; width: 40px; background: #334455; border-radius: 2px;
        }
        .gutter-vertical:hover::after, .gutter-vertical-dragging::after {
            background: var(--accent); box-shadow: 0 0 10px var(--accent);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020202; }
        ::-webkit-scrollbar-thumb { background: #334455; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* VISUALIZER V3.0 AESTHETICS */
        .crt-overlay {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg, 
                rgba(255, 0, 0, 0.06), 
                rgba(0, 255, 0, 0.02), 
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 10;
        }
        
        /* Mode Toggle - Compact */
        .mode-toggle {
            display: flex;
            background: #000;
            border: 1px solid var(--accent);
            padding: 2px;
            height: 32px; 
            width: 200px;
        }
        .mode-btn {
            flex: 1;
            font-family: var(--font-header);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #64748b;
            position: relative;
            overflow: hidden;
        }
        .mode-btn.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent);
            z-index: 10;
        }
        .mode-btn:hover:not(.active) {
            color: #fff;
            background: rgba(51, 204, 255, 0.1);
        }
        
        /* Waveform Icons */
        .wave-icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: 1px solid #334455;
            background: rgba(0,0,0,0.4);
            color: #64748b;
            transition: all 0.2s;
            padding: 10px;
        }
        .wave-icon-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(51, 204, 255, 0.1);
            box-shadow: 0 0 15px rgba(51, 204, 255, 0.2);
        }
        .wave-icon-btn:hover:not(.active) {
            border-color: #94a3b8;
            color: #e2e8f0;
        }
        .wave-svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Pulsing Glow Animation - Slower */
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(51, 204, 255, 0.5)); opacity: 1; }
            50% { filter: drop-shadow(0 0 15px rgba(51, 204, 255, 0.8)); opacity: 0.8; }
        }
        .icon-glow {
            animation: pulse-glow 6s infinite ease-in-out;
        }

        /* Full Height Bounce Animation for Button */
        @keyframes bounce-vertical {
            0% { bottom: 1rem; }
            100% { bottom: calc(100% - 4.5rem); } /* Increased bounce range */
        }
        .animate-bounce-vertical {
            animation: bounce-vertical 3s ease-in-out infinite alternate; /* Slower 3s duration */
        }
        
        /* Loading Scan Animation for System Msg */
        @keyframes scan-line {
            0% { background-position: 200% 0; }
            100% { background-position: 0% 0; }
        }
        .animate-scan {
            background: linear-gradient(90deg, rgba(5,10,16,0.2) 25%, rgba(51, 204, 255, 0.15) 50%, rgba(5,10,16,0.2) 75%);
            background-size: 200% 100%;
            animation: scan-line 2s infinite linear;
        }
    </style>

            {

                    let x = 0;

                    for (let i = 0; i < 1024; i++) {
                        const v = dataArray[i] / 128.0;
                        const y = v * h / 2;

                        if (i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                        x += sliceWidth;
                    }

                    ctx.lineTo(w, h / 2);
                    ctx.stroke();
                };

                render();
                return () => cancelAnimationFrame(animationId);
            }, []);

            return (
                <div className="w-full h-full bg-black border border-gray-800 relative overflow-hidden">
                    <div className="crt-overlay"></div>
                    <div className="absolute top-2 left-3 text-xs text-[#33ccff] font-bold tracking-widest pointer-events-none uppercase z-20 opacity-80">
                        Oscilloscope // Signal Feed
                    </div>
                    <canvas ref={canvasRef} className="w-full h-full opacity-90 relative z-0"></canvas>
                </div>
            );
        };

        const SoundWaveIcon = () => (
            <svg className="w-6 h-6 text-[#33ccff] icon-glow" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3v18" />
                <path d="M16 8v8" />
                <path d="M8 8v8" />
                <path d="M20 10v4" />
                <path d="M4 10v4" />
            </svg>
        );

        const WaveIcons = {
            sine: <path d="M2 12c0-9 10-9 10 0s10 9 10 0" />,
            square: <path d="M3 12h4v-8h6v16h6v-8h2" />,
            sawtooth: <path d="M4 18L12 6v12l8-12" />,
            triangle: <path d="M3 18l9-12 9 12" />
        };

        const DEFAULT_CODE = `// Welcome to SynthGen AI
const osc = ctx.createOscillator();
const gain = ctx.createGain();

osc.type = 'triangle'; 
osc.frequency.setValueAtTime(261.63, ctx.currentTime); 
osc.frequency.linearRampToValueAtTime(329.63, ctx.currentTime + 1.0); 

gain.gain.setValueAtTime(0, ctx.currentTime);
gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.2); 
gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 2.0); 

osc.connect(gain);
gain.connect(destination);

osc.start();
osc.stop(ctx.currentTime + 2.1);`;

        // --- APP COMPONENT ---
        const App = () => {
            const [mode, setMode] = useState(AppMode.AI_CLONE);
            const [leftPanelWidth, setLeftPanelWidth] = useState(50);
            const [isDragging, setIsDragging] = useState(false);
            
            // New State for Vertical Split
            const [topPanelHeight, setTopPanelHeight] = useState(60);
            const [isDraggingVertical, setIsDraggingVertical] = useState(false);
            
            const [masterVol, setMasterVolState] = useState(1.0);
            
            const [generatedCode, setGeneratedCode] = useState(DEFAULT_CODE);
            const [explanation, setExplanation] = useState("System Online. Waiting for input.");
            const [userPrompt, setUserPrompt] = useState("");
            const [refinePrompt, setRefinePrompt] = useState("");
            const [isLoading, setIsLoading] = useState(false);

            const [library, setLibrary] = useState([]);
            const [pendingDeletes, setPendingDeletes] = useState({});
            const [expandedItems, setExpandedItems] = useState(new Set());
            const [playingId, setPlayingId] = useState(null);

            // API Key Management
            const [showKeyModal, setShowKeyModal] = useState(false);
            const [tempKey, setTempKey] = useState("");
            // Model Selection State
            const [selectedModel, setSelectedModel] = useState("gemini-2.5-flash");

            const [synthParams, setSynthParams] = useState({
                waveType: 'triangle',
                frequency: 440,
                gain: 0.5,
                filterFreq: 2000,
                filterType: 'lowpass',
                attack: 0.1,
                decay: 0.3,
                sustain: 0.5,
                release: 1.0
            });

            const splitterRef = useRef(null);
            const workspaceRef = useRef(null);
            const rightPanelRef = useRef(null);

            useEffect(() => {
                getAudioContext();
                setMasterVolume(1.0);
                const saved = localStorage.getItem('synthgen_library');
                if (saved) {
                    try { setLibrary(JSON.parse(saved)); } catch(e) {}
                } else {
                    // Populate factory presets if library is empty
                    const defaults = FACTORY_PRESETS.map(p => ({
                        id: crypto.randomUUID(),
                        title: p.title,
                        code: p.code,
                        description: p.description,
                        notes: "Factory Preset",
                        timestamp: Date.now()
                    }));
                    setLibrary(defaults);
                }

                // Restore API Key
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) {
                    window.process.env.API_KEY = savedKey;
                    setTempKey(savedKey);
                }
                // Restore Model Selection
                const savedModel = localStorage.getItem('gemini_model_pref');
                if (savedModel) {
                    setSelectedModel(savedModel);
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('synthgen_library', JSON.stringify(library));
            }, [library]);

            // Horizontal Drag
            const handleMouseDown = (e) => { setIsDragging(true); e.preventDefault(); };
            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (!isDragging || !workspaceRef.current) return;
                    const rect = workspaceRef.current.getBoundingClientRect();
                    const newWidth = ((e.clientX - rect.left) / rect.width) * 100;
                    if (newWidth > 20 && newWidth < 80) setLeftPanelWidth(newWidth);
                };
                const handleMouseUp = () => setIsDragging(false);
                if (isDragging) {
                    document.addEventListener('mousemove', handleMouseMove);
                    document.addEventListener('mouseup', handleMouseUp);
                    document.body.style.cursor = 'col-resize';
                } else {
                    document.body.style.cursor = 'default';
                }
                return () => { document.removeEventListener('mousemove', handleMouseMove); document.removeEventListener('mouseup', handleMouseUp); };
            }, [isDragging]);

            // Vertical Drag
            const handleVerticalMouseDown = (e) => {
                setIsDraggingVertical(true);
                e.preventDefault();
            };
            
            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (!isDraggingVertical || !rightPanelRef.current) return;
                    const rect = rightPanelRef.current.getBoundingClientRect();
                    // Calculate relative Y within the right panel container
                    const relativeY = e.clientY - rect.top;
                    const newHeight = (relativeY / rect.height) * 100;
                    
                    if (newHeight > 20 && newHeight < 60) { // Updated to 60% max to prevent bottom collapse
                        setTopPanelHeight(newHeight);
                    }
                };
                const handleMouseUp = () => {
                    setIsDraggingVertical(false);
                    document.body.style.cursor = 'default';
                };
                
                if (isDraggingVertical) {
                    document.addEventListener('mousemove', handleMouseMove);
                    document.addEventListener('mouseup', handleMouseUp);
                    document.body.style.cursor = 'row-resize';
                }
                
                return () => {
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                };
            }, [isDraggingVertical]);

            const addToLibrary = (code, desc, title, modelId, originalPrompt) => {
                const newItem = {
                    id: crypto.randomUUID(),
                    title: title || "Generated Sound",
                    code: code,
                    description: desc,
                    model: modelId || "Unknown",
                    prompt: originalPrompt || "Manual/Unknown",
                    notes: "",
                    timestamp: Date.now()
                };
                setLibrary(prev => [newItem, ...prev]);
                return newItem;
            };

            const startDelete = (id) => {
                setPendingDeletes(prev => ({ ...prev, [id]: 3 }));
            };

            const cancelDelete = (id) => {
                setPendingDeletes(prev => {
                    const next = { ...prev };
                    delete next[id];
                    return next;
                });
            };

            useEffect(() => {
                const interval = setInterval(() => {
                    setPendingDeletes(prev => {
                        const next = { ...prev };
                        let changed = false;
                        for (const id in next) {
                            if (next[id] > 0) {
                                next[id] -= 1;
                                changed = true;
                            }
                        }
                        return changed ? next : prev;
                    });
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                Object.entries(pendingDeletes).forEach(([id, count]) => {
                    if (count <= 0) {
                        setLibrary(prev => prev.filter(item => item.id !== id));
                        setPendingDeletes(prev => {
                            const next = { ...prev };
                            delete next[id];
                            return next;
                        });
                    }
                });
            }, [pendingDeletes]);

            const updateItem = (id, updates) => {
                setLibrary(prev => prev.map(item => item.id === id ? { ...item, ...updates } : item));
            };

            const toggleExpand = (id) => {
                setExpandedItems(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const playLibraryItem = (item) => {
                if (playingId === item.id) {
                    setPlayingId(null);
                    stopAudio();
                } else {
                    stopAudio().then(() => { 
                        getAudioContext(); // Re-init
                        setPlayingId(item.id);
                        executeGeneratedCode(item.code);
                        setTimeout(() => {
                            setPlayingId(prev => prev === item.id ? null : prev);
                        }, 3000); 
                    });
                }
            };

            const loadIntoEditor = (item) => {
                setGeneratedCode(item.code);
                setExplanation(`Loaded: "${item.title}" | Model: ${item.model || 'Legacy'} | Source: "${item.prompt || 'Unknown'}"`);
            };

            const updateVolume = (val) => {
                setMasterVolState(val);
                setMasterVolume(val);
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                if (file.size > 4 * 1024 * 1024) { setExplanation("ERROR: File too large (Max 4MB)."); return; }
                
                setIsLoading(true);
                setExplanation("Uploading & Analyzing Audio...");
                try {
                    const base64 = await fileToBase64(file);
                    // Pass selectedModel
                    const result = await generateSynthCodeFromAudio(base64, file.type, selectedModel);
                    setGeneratedCode(result.code);
                    setExplanation("Analysis complete. Code generated from source audio.");
                    // Add to library with metadata
                    addToLibrary(result.code, result.explanation, file.name || "Imported Audio", selectedModel, "Audio Analysis");
                } catch (error) {
                    setExplanation("Analysis Failed: " + error.message);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleTextGen = async () => {
                if (!userPrompt.trim()) return;
                setIsLoading(true);
                setExplanation("Generating synthesis parameters...");
                try {
                    const result = await generateSynthCodeFromText(userPrompt, synthParams, selectedModel);
                    setGeneratedCode(result.code);
                    setExplanation("Generation complete. Module ready.");
                    addToLibrary(result.code, result.explanation, userPrompt, selectedModel, userPrompt);
                } catch (error) {
                    setExplanation("Generation Failed: " + error.message);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleRefine = async () => {
                if (!refinePrompt.trim()) return;
                setIsLoading(true);
                setExplanation("Refining module logic...");
                try {
                    const result = await refineCodeWithPrompt(generatedCode, refinePrompt, selectedModel);
                    setGeneratedCode(result.code);
                    setExplanation("Refinement applied.");
                    
                    const timestamp = new Date().toLocaleTimeString();
                    const refineTitle = `Refined: ${refinePrompt.slice(0, 15)}... (${timestamp})`;
                    
                    addToLibrary(result.code, result.explanation, refineTitle, selectedModel, `Refined: ${refinePrompt}`);
                    setRefinePrompt("");
                } catch (error) {
                    setExplanation("Refinement Failed: " + error.message);
                } finally {
                    setIsLoading(false);
                }
            };

            const runCode = () => {
                getAudioContext().resume();
                executeGeneratedCode(generatedCode);
            };

            const triggerManual = () => {
                getAudioContext().resume();
                playManualSynth(synthParams);
            };

            const updateParam = (key, val) => {
                setSynthParams(prev => ({...prev, [key]: val}));
            };

            const saveApiKey = () => {
                if (!tempKey.trim()) return;
                localStorage.setItem('gemini_api_key', tempKey.trim());
                window.process.env.API_KEY = tempKey.trim();
                setShowKeyModal(false);
                setExplanation("SYSTEM: Authorization credentials updated. Uplink established.");
            };

            return (
                <div className="flex flex-col h-screen p-6 box-border select-none font-ui font-light">
                    {/* HEADER */}
                    <header className="flex justify-between items-center mb-6 pb-2 border-b border-gray-800 flex-shrink-0 z-10">
                        <div className="flex flex-col w-1/4">
                            <h1 className="text-2xl text-white font-light tracking-tight flex items-center gap-3">
                                <SoundWaveIcon />
                                <span className="font-semibold tracking-tighter">SYNTHGEN</span> AI
                            </h1>
                        </div>

                        <div className="flex-grow flex justify-center">
                            <div className="flex bg-black/40 border border-[#33ccff]/30 p-1 rounded-sm gap-1">
                                <button 
                                    onClick={() => setMode(AppMode.AI_CLONE)} 
                                    className={`px-6 py-2 text-xs font-bold uppercase tracking-wider transition-all duration-300 rounded-sm ${
                                        mode === AppMode.AI_CLONE 
                                        ? 'bg-[#33ccff] text-black shadow-[0_0_15px_rgba(51,204,255,0.4)]' 
                                        : 'text-slate-500 hover:text-[#33ccff] hover:bg-[#33ccff]/5'
                                    }`}
                                >
                                    Audio Library
                                </button>
                                <button 
                                    onClick={() => setMode(AppMode.MANUAL)} 
                                    className={`px-6 py-2 text-xs font-bold uppercase tracking-wider transition-all duration-300 rounded-sm ${
                                        mode === AppMode.MANUAL 
                                        ? 'bg-[#33ccff] text-black shadow-[0_0_15px_rgba(51,204,255,0.4)]' 
                                        : 'text-slate-500 hover:text-[#33ccff] hover:bg-[#33ccff]/5'
                                    }`}
                                >
                                    Manual Synth
                                </button>
                            </div>
                        </div>

                        <div className="w-1/4 flex justify-end items-center gap-4">
                            <button 
                                onClick={() => setShowKeyModal(true)}
                                className="text-[#33ccff] opacity-40 hover:opacity-100 transition-all duration-300 hover:drop-shadow-[0_0_8px_rgba(51,204,255,0.8)]"
                                title="Configure API Key"
                            >
                                <Key size={16} />
                            </button>
                            <div className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">
                                v2.2.0 // <span className="text-[#33ccff]">ONLINE</span>
                            </div>
                        </div>
                    </header>

                    {/* TOP ROW */}
                    <div className="flex w-full h-32 gap-6 mb-6 flex-shrink-0 z-10">
                        <div className="flex-grow">
                            <Visualizer />
                        </div>
                        <div className="w-72 bg-black/40 border border-gray-800 p-6 flex flex-col justify-center gap-4 relative backdrop-blur-sm">
                                <div className="flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <label className="text-xs text-[#33ccff] font-bold uppercase tracking-wider">Master Out</label>
                                </div>
                                <button onClick={() => updateVolume(1.0)} className="text-[10px] text-slate-500 hover:text-white border border-transparent hover:border-[#33ccff] hover:bg-[#33ccff]/10 px-3 py-1 transition-all uppercase font-bold">
                                    RESET
                                </button>
                            </div>
                            <input type="range" min="0" max="2" step="0.01" value={masterVol} onChange={(e) => updateVolume(parseFloat(e.target.value))} className="cyber-range" />
                        </div>
                    </div>

                    {/* MAIN WORKSPACE */}
                    <div ref={workspaceRef} className="flex flex-grow overflow-hidden z-10 relative">
                        {/* LEFT PANEL */}
                            <div className="glass-panel relative flex flex-col" style={{ flexBasis: `${leftPanelWidth}%` }}>
                                {/* Header aligned to match right panel: h-12, px-6, items-center */}
                                <div className="flex h-12 border-b border-white/10 bg-black/40 relative z-20 items-center justify-between px-6 flex-shrink-0">
                                    <h2 className="text-white font-semibold text-xs uppercase tracking-wide flex items-center gap-3">
                                        <span className="w-1.5 h-1.5 bg-[#33ccff] rounded-full"></span>
                                        {mode === AppMode.AI_CLONE ? 'Audio Library' : 'Synthesizer Controls'}
                                    </h2>
                                    {mode === AppMode.AI_CLONE && (
                                        <span className="text-[10px] text-slate-500 font-mono uppercase tracking-widest">{library.length} Items</span>
                                    )}
                                </div>

                            <div className="overflow-y-auto custom-scrollbar flex flex-col flex-grow bg-[#080c10]">
                                {mode === AppMode.AI_CLONE ? (
                                    <div className="flex flex-col h-full">
                                        <div className="p-4 border-b border-white/5">
                                            <div className="border border-dashed border-slate-700 bg-[#050a10]/50 h-20 flex items-center justify-center gap-4 hover:border-[#33ccff]/50 hover:bg-[#33ccff]/5 transition-all relative group cursor-pointer rounded">
                                                <div className="text-slate-500 group-hover:text-[#33ccff] transition-colors">
                                                    <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M12 4v16m8-8H4" /></svg>
                                                </div>
                                                <div className="text-xs text-slate-400 font-medium group-hover:text-white transition-colors">
                                                    IMPORT AUDIO FILE
                                                </div>
                                                <input type="file" className="opacity-0 absolute inset-0 cursor-pointer" accept="audio/*" onChange={handleFileUpload} />
                                            </div>
                                            {isLoading && <div className="mt-2 text-[#33ccff] font-mono text-[10px] text-center animate-pulse">ANALYZING SIGNAL...</div>}
                                        </div>

                                        <div className="flex-grow p-2 space-y-2">
                                            {library.length === 0 && !isLoading && (
                                                <div className="text-center p-8 text-slate-700 text-xs tracking-widest uppercase">Library Empty</div>
                                            )}
                                            {library.map((item) => {
                                                const isDeleting = pendingDeletes[item.id] !== undefined;
                                                const count = pendingDeletes[item.id];
                                                const isExpanded = expandedItems.has(item.id);
                                                const isPlaying = playingId === item.id;

                                                if (isDeleting) {
                                                    return (
                                                        <div key={item.id} className="h-20 bg-red-950/40 border border-red-500/30 relative overflow-hidden transition-all flex items-center">
                                                            <div className="flex-grow flex items-center justify-center">
                                                                <span className="text-red-500 font-bold text-sm uppercase tracking-widest">
                                                                    DELETING IN {count}...
                                                                </span>
                                                            </div>
                                                            <button onClick={() => cancelDelete(item.id)} className="h-full w-24 bg-red-600 text-white font-header text-xs uppercase tracking-wider hover:bg-white hover:text-black transition-colors shadow-lg shadow-red-900/50 border-l border-red-500/30">
                                                                UNDO
                                                            </button>
                                                        </div>
                                                    );
                                                }

                                                return (
                                                    <div key={item.id} className="bg-black/20 border border-white/5 hover:border-white/10 transition-colors group">
                                                        <div className="flex h-14 border-b border-white/5">
                                                            <button 
                                                                onClick={() => playLibraryItem(item)}
                                                                className={`w-14 h-full flex items-center justify-center transition-all ${
                                                                    isPlaying 
                                                                    ? 'bg-[#33ccff]/10 text-[#33ccff] hover:bg-red-500 hover:text-black hover:shadow-[0_0_15px_rgba(239,68,68,0.6)]' 
                                                                    : 'bg-[#33ccff]/5 text-[#33ccff] hover:bg-[#33ccff] hover:text-black hover:shadow-[0_0_15px_rgba(51,204,255,0.6)]'
                                                                }`}
                                                            >
                                                                {isPlaying ? <Square size={14} fill="currentColor"/> : <Play size={16} fill="currentColor"/>}
                                                            </button>
                                                            
                                                            <div 
                                                                className="flex-grow px-3 flex flex-col justify-center min-w-0 cursor-pointer hover:bg-white/5 transition-colors"
                                                                onClick={() => loadIntoEditor(item)}
                                                            >
                                                                <div className="flex items-baseline gap-2 mb-0.5">
                                                                    <input 
                                                                        value={item.title}
                                                                        onChange={(e) => updateItem(item.id, { title: e.target.value })}
                                                                        onClick={(e) => e.stopPropagation()}
                                                                        className="bg-transparent border-b border-transparent hover:border-slate-700 focus:border-[#33ccff] text-white text-xs font-bold font-ui uppercase tracking-wide focus:outline-none w-full"
                                                                        placeholder="Untitled Sound"
                                                                    />
                                                                </div>
                                                                <div className="text-[10px] text-slate-500 font-mono truncate w-full flex gap-2">
                                                                    <span>{new Date(item.timestamp).toLocaleTimeString()}</span>
                                                                    {item.model && (
                                                                        <>
                                                                            <span className="text-slate-700">|</span>
                                                                            <span className="text-slate-400" title={item.model}>
                                                                                {item.model.replace('gemini-', '').replace('flash', 'FL').toUpperCase()}
                                                                            </span>
                                                                        </>
                                                                    )}
                                                                </div>
                                                            </div>

                                                            <button 
                                                                onClick={() => startDelete(item.id)}
                                                                className="w-12 h-full text-slate-700 hover:text-white hover:bg-red-500/80 transition-all border-l border-white/5 flex items-center justify-center opacity-0 group-hover:opacity-100"
                                                            >
                                                                <Trash2 size={16} />
                                                            </button>
                                                        </div>

                                                        <div className="p-2 bg-black/30">
                                                            <input 
                                                                value={item.notes}
                                                                onChange={(e) => updateItem(item.id, { notes: e.target.value })}
                                                                placeholder="Enter notes..."
                                                                className="w-full bg-black/50 border border-slate-800 text-xs text-slate-300 p-1.5 focus:border-[#33ccff] focus:outline-none font-mono mb-2"
                                                            />
                                                            
                                                            <button 
                                                                onClick={() => toggleExpand(item.id)}
                                                                className="w-full flex items-center justify-between px-2 py-1 text-[9px] text-slate-600 hover:text-slate-400 uppercase tracking-wider border border-transparent hover:border-[#33ccff]/20 transition-colors"
                                                            >
                                                                <span>Generated Description</span>
                                                                {isExpanded ? <ChevronDown size={10}/> : <ChevronRight size={10}/>}
                                                            </button>
                                                            
                                                            {isExpanded && (
                                                                <div className="mt-2 relative animate-in slide-in-from-top-2 duration-200">
                                                                    <textarea 
                                                                        value={item.description}
                                                                        onChange={(e) => updateItem(item.id, { description: e.target.value })}
                                                                        className="w-full h-24 bg-black/50 border border-slate-700 text-[10px] text-slate-300 font-mono p-2 focus:border-[#33ccff] focus:outline-none resize-none leading-relaxed"
                                                                        spellCheck={false}
                                                                    />
                                                                    <button 
                                                                        onClick={() => navigator.clipboard.writeText(item.description)}
                                                                        className="absolute bottom-2 right-2 px-2 py-0.5 bg-slate-900 text-[#33ccff] border border-[#33ccff] hover:bg-[#33ccff] hover:text-black text-[9px] font-bold uppercase transition-all z-10 shadow-lg"
                                                                    >
                                                                        COPY
                                                                    </button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex flex-col gap-8 p-6">
                                        <div className="space-y-3">
                                            <div className="text-xs font-bold text-[#33ccff] tracking-wider">AI PROMPT GENERATOR</div>
                                            <div className="flex gap-3 h-10">
                                                <input 
                                                    type="text" 
                                                    className="w-full bg-black/50 border border-slate-700 px-4 text-sm font-mono text-white focus:border-[#33ccff] outline-none placeholder-slate-600"
                                                    placeholder="e.g. 'Retro laser jump'"
                                                    value={userPrompt}
                                                    onKeyDown={(e) => e.key === 'Enter' && handleTextGen()}
                                                    onChange={e => setUserPrompt(e.target.value)}
                                                />
                                                <button onClick={handleTextGen} disabled={isLoading} className="cyber-btn px-6 text-sm font-bold">GEN</button>
                                            </div>
                                        </div>
                                        
                                        <div className="h-px bg-slate-800"></div>

                                        <div className="space-y-6">
                                            <div className="text-xs font-bold text-slate-500 tracking-wider">MANUAL OVERRIDE</div>
                                            
                                            <div className="grid grid-cols-4 gap-2">
                                                {['sine','square','sawtooth','triangle'].map(t => (
                                                    <button key={t} 
                                                        onClick={() => updateParam('waveType', t)}
                                                        className={`wave-icon-btn ${synthParams.waveType === t ? 'active' : ''}`}
                                                    >
                                                        <svg className="wave-svg" viewBox="0 0 24 24">{WaveIcons[t]}</svg>
                                                        <span className="text-[10px] uppercase font-bold">{t === 'sawtooth' ? 'saw' : t}</span>
                                                    </button>
                                                ))}
                                            </div>

                                            <div className="space-y-5">
                                                <div>
                                                    <div className="flex justify-between text-[10px] text-[#33ccff] font-bold tracking-wider mb-2"><span>FREQUENCY</span><span>{synthParams.frequency} Hz</span></div>
                                                    <input type="range" className="cyber-range" min="50" max="2000" value={synthParams.frequency} onChange={e => updateParam('frequency', Number(e.target.value))} />
                                                </div>
                                                <div>
                                                    <div className="flex justify-between text-[10px] text-[#33ccff] font-bold tracking-wider mb-2"><span>FILTER CUTOFF</span><span>{synthParams.filterFreq} Hz</span></div>
                                                    <input type="range" className="cyber-range" min="100" max="5000" value={synthParams.filterFreq} onChange={e => updateParam('filterFreq', Number(e.target.value))} />
                                                </div>
                                            </div>
                                            
                                            <div className="grid grid-cols-4 gap-4 pt-2">
                                                {['attack', 'decay', 'sustain', 'release'].map((k) => (
                                                    <div key={k} className="flex flex-col gap-2">
                                                        <span className="text-[10px] text-center text-slate-400 font-bold uppercase">{k.charAt(0)}</span>
                                                        <input 
                                                            type="range" 
                                                            className="cyber-range" 
                                                            min="0" 
                                                            max={k === 'release' ? 2 : 1} 
                                                            step="0.05" 
                                                            value={synthParams[k]} 
                                                            onChange={e => updateParam(k, Number(e.target.value))} 
                                                        />
                                                    </div>
                                                ))}
                                            </div>

                                            <button onClick={triggerManual} className="cyber-btn cyber-btn-secondary w-full py-3 gap-3 mt-4 text-sm font-bold">
                                                <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                                                TRIGGER SOUND
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* SPLITTER */}
                        <div ref={splitterRef} className={`gutter ${isDragging ? 'gutter-dragging' : ''}`} onMouseDown={handleMouseDown}></div>

                        {/* RIGHT PANEL */}
                        <div className="glass-panel" style={{ flexBasis: `${100 - leftPanelWidth}%` }}>
                            <div className="flex h-12 border-b border-white/10 bg-black/40 relative z-20 items-stretch justify-between flex-shrink-0">
                                <div className="flex items-center px-6">
                                    <h2 className="text-white font-semibold text-xs uppercase tracking-wide">Generated Module</h2>
                                </div>
                                <div className="flex">
                                    <button 
                                        onClick={() => navigator.clipboard.writeText(generatedCode)} 
                                        className="flex items-center gap-1 px-4 text-[10px] text-slate-400 hover:text-white transition-colors border-l border-white/5"
                                    >
                                        <Copy size={12}/> COPY
                                    </button>
                                    <button 
                                        onClick={runCode} 
                                        className="flex items-center px-8 bg-[#33ccff]/10 text-[#33ccff] hover:bg-[#33ccff] hover:text-black hover:shadow-[0_0_20px_rgba(51,204,255,0.5)] border-l border-white/10 font-bold tracking-widest text-xs transition-all uppercase gap-2"
                                    >
                                        <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                        SIMULATE
                                    </button>
                                </div>
                            </div>
                            
                            <div ref={rightPanelRef} className="flex flex-col flex-grow overflow-hidden relative">
                                <div style={{ height: `${topPanelHeight}%` }} className="relative bg-[#080c10] overflow-hidden z-0">
                                    <textarea 
                                        value={generatedCode}
                                        onChange={e => setGeneratedCode(e.target.value)}
                                        className="w-full h-full bg-transparent text-cyan-50 font-mono text-xs p-6 border-none focus:outline-none resize-none leading-relaxed"
                                        spellCheck={false}
                                    ></textarea>
                                </div>

                                <div 
                                    className={`gutter-vertical ${isDraggingVertical ? 'gutter-vertical-dragging' : ''}`} 
                                    onMouseDown={handleVerticalMouseDown}
                                ></div>

                                <div className="flex-grow border-t border-white/10 bg-black/40 flex flex-col overflow-hidden min-h-0">
                                    <div className="flex-grow flex flex-col px-4 pt-3 pb-6 overflow-hidden gap-3">
                                        
                                        {/* System Message Log */}
                                        <div className={`text-[10px] font-mono p-3 rounded leading-relaxed flex-shrink-0 min-h-[40px] max-h-32 overflow-y-auto custom-scrollbar shadow-inner transition-all duration-500 relative group overflow-hidden ${
                                            isLoading 
                                            ? 'bg-[#33ccff]/10 border border-[#33ccff]/40 text-[#33ccff] shadow-[0_0_20px_rgba(51,204,255,0.2)] animate-scan' 
                                            : 'bg-black/20 border border-slate-800 text-slate-400'
                                        }`}>
                                            <div className="relative z-10 pr-8">
                                                <span className="text-[#33ccff] font-bold">SYSTEM_MSG:</span> {explanation}
                                                <button 
                                                    onClick={(e) => {
                                                        e.stopPropagation(); // Prevents bubbling issues
                                                        navigator.clipboard.writeText(explanation);
                                                    }}
                                                    className="absolute -top-1 -right-1 p-1.5 text-slate-500 hover:text-[#33ccff] hover:bg-black/50 rounded transition-all cursor-pointer z-50"
                                                    title="Copy Log"
                                                >
                                                    <Copy size={12} />
                                                </button>
                                            </div>
                                        </div>

                                        {/* AI Prompt Generator - Expands to fill space */}
                                        <div className="flex-grow flex flex-col min-h-0 space-y-2">
                                            <div className="text-xs font-bold text-[#33ccff] tracking-wider flex-shrink-0 flex justify-between items-center">
                                                <span>AI PROMPT GENERATOR</span>
                                                <span className="text-[9px] text-slate-600 font-mono">SHIFT+ENTER FOR NEW LINE</span>
                                            </div>
                                            <div className="flex-grow relative group">
                                                <textarea 
                                                    className="w-full h-full bg-black/50 border border-slate-700 rounded p-4 text-sm font-mono text-white focus:border-[#33ccff] outline-none resize-none placeholder-slate-600 leading-relaxed custom-scrollbar transition-colors"
                                                    placeholder="Describe your sound effect..."
                                                    value={userPrompt}
                                                    onKeyDown={(e) => {
                                                        if (e.key === 'Enter' && !e.shiftKey) {
                                                            e.preventDefault();
                                                            handleTextGen();
                                                        }
                                                    }}
                                                    onChange={e => setUserPrompt(e.target.value)}
                                                />
                                                <button 
                                                    onClick={handleTextGen} 
                                                    disabled={isLoading} 
                                                    style={{ animationPlayState: isLoading ? 'paused' : 'running' }}
                                                    className="absolute right-4 bottom-4 w-14 h-14 rounded-full border border-[#33ccff]/30 bg-[#33ccff]/10 backdrop-blur-[2px] text-[#33ccff] font-bold text-[10px] tracking-widest shadow-[0_0_15px_rgba(51,204,255,0.1)] hover:bg-[#33ccff]/20 hover:shadow-[0_0_30px_#33ccff] hover:border-[#33ccff] transition-all duration-300 z-20 animate-bounce-vertical flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
                                                >
                                                    {isLoading ? '...' : 'GEN'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Refine Bar - Moved Outside */}
                            <div className="h-12 border-t border-white/5 bg-black/20 flex items-center pr-2 flex-shrink-0 z-20">
                                <input 
                                    type="text" 
                                    className="flex-grow bg-transparent px-4 text-xs font-mono text-white focus:outline-none placeholder-slate-600 h-full"
                                    placeholder="Type to refine code..." 
                                    value={refinePrompt}
                                    onChange={e => setRefinePrompt(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleRefine()}
                                />
                                <button onClick={handleRefine} className="h-8 w-8 flex items-center justify-center text-slate-500 hover:text-white hover:bg-white/5 rounded transition-colors">
                                    <ChevronRight size={16} />
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* API KEY MODAL */}
                    {showKeyModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-md">
                            <div className="w-96 glass-panel p-6 relative border border-[#33ccff]/30 shadow-[0_0_50px_rgba(51,204,255,0.1)]">
                                <button onClick={() => setShowKeyModal(false)} className="absolute top-2 right-2 text-slate-500 hover:text-white"><X size={16}/></button>
                                <h3 className="text-[#33ccff] font-bold text-sm tracking-widest mb-4 flex items-center gap-2">
                                    <Key size={14}/> SYSTEM AUTHORIZATION
                                </h3>
                                <p className="text-[10px] text-slate-400 mb-4 leading-relaxed">
                                    Initialize connection with Google Gemini API. <br/>
                                    <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-white hover:text-[#33ccff] underline decoration-dotted">Get your API Key here</a>.
                                </p>
                                <div className="mb-4">
                                    <label className="text-[10px] text-[#33ccff] font-bold uppercase tracking-wider mb-2 block">
                                        Select Logic Engine
                                    </label>
                                    <div className="relative">
                                        <select 
                                            value={selectedModel}
                                            onChange={(e) => {
                                                setSelectedModel(e.target.value);
                                                localStorage.setItem('gemini_model_pref', e.target.value);
                                            }}
                                            className="w-full bg-black/50 border border-slate-700 text-xs text-white p-3 focus:border-[#33ccff] outline-none font-mono appearance-none"
                                        >
                                            {AVAILABLE_MODELS.map(m => (
                                                <option key={m.id} value={m.id}>
                                                    {m.label}
                                                </option>
                                            ))}
                                        </select>
                                        <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">
                                            <ChevronDown size={14} />
                                        </div>
                                    </div>
                                </div>
                                <input 
                                    type="password" 
                                    value={tempKey}
                                    onChange={e => setTempKey(e.target.value)}
                                    placeholder="Paste API Key..."
                                    className="w-full bg-black/50 border border-slate-700 text-xs text-white p-3 focus:border-[#33ccff] outline-none font-mono mb-4"
                                />
                                <button onClick={saveApiKey} className="cyber-btn w-full py-2 text-xs font-bold">ESTABLISH UPLINK</button>
                            </div>
                        </div>
                        
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
  </body>
</html>
